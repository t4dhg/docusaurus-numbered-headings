name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare reviewed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      verifier_sha256: ${{ steps.seal.outputs.verifier_sha256 }}
      name: ${{ steps.preflight.outputs.name }}
      version: ${{ steps.preflight.outputs.version }}
      tag: ${{ steps.preflight.outputs.tag }}
      commit: ${{ steps.preflight.outputs.commit }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate tag and protected-branch ancestry
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_REPOSITORY" = "t4dhg/docusaurus-numbered-headings"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag is not canonical stable SemVer." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release event commit is invalid." >&2
            exit 1
          fi
          origin_url="$(git remote get-url origin)"
          test "$origin_url" = "https://github.com/t4dhg/docusaurus-numbered-headings"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          test "$tag_type" = "tag"
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          event_commit="$(git rev-parse --verify "${RELEASE_SHA}^{commit}")"
          test "$tag_commit" = "$event_commit"
          test "$event_commit" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/master

      - name: Validate release metadata
        id: preflight
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-release.mjs preflight

      - name: Install exact npm CLI
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --registry https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org

      - name: Verify package
        run: npm run verify

      - name: Pack final artifact
        env:
          PACK_DIRECTORY: ${{ runner.temp }}/dnh-final-pack
          PACK_REPORT: ${{ runner.temp }}/dnh-pack-report.json
        run: |
          set -euo pipefail
          mkdir -p "$PACK_DIRECTORY"
          npm pack --json --ignore-scripts --pack-destination "$PACK_DIRECTORY" --registry https://registry.npmjs.org > "$PACK_REPORT"

      - name: Prepare release bundle
        env:
          PACK_DIRECTORY: ${{ runner.temp }}/dnh-final-pack
          PACK_REPORT: ${{ runner.temp }}/dnh-pack-report.json
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          node scripts/check-release.mjs prepare \
            --pack-report "$PACK_REPORT" \
            --pack-directory "$PACK_DIRECTORY" \
            --bundle "$BUNDLE_DIRECTORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Test exact final artifact
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          RELEASE_NAME: ${{ steps.preflight.outputs.name }}
          RELEASE_VERSION: ${{ steps.preflight.outputs.version }}
        run: node scripts/test-package.mjs --tarball "$BUNDLE_DIRECTORY/$RELEASE_NAME-$RELEASE_VERSION.tgz"

      - name: Revalidate release bundle
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          RELEASE_TAG: ${{ steps.preflight.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.preflight.outputs.commit }}
        run: |
          node scripts/check-release.mjs validate-bundle \
            --bundle "$BUNDLE_DIRECTORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Seal release bundle identity
        id: seal
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
        run: |
          set -euo pipefail
          manifest_sha256="$(sha256sum "$BUNDLE_DIRECTORY/release-manifest.json" | cut -d ' ' -f 1)"
          verifier_sha256="$(sha256sum "$BUNDLE_DIRECTORY/check-release.mjs" | cut -d ' ' -f 1)"
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$verifier_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'manifest_sha256=%s\n' "$manifest_sha256" >> "$GITHUB_OUTPUT"
          printf 'verifier_sha256=%s\n' "$verifier_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-bundle
          path: ${{ runner.temp }}/dnh-release-bundle/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Validate uploaded artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

  publish:
    name: Publish and verify exact npm artifact
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      id-token: write
    concurrency:
      group: npm-publish-docusaurus-numbered-headings
      cancel-in-progress: false

    steps:
      - name: Set up Node.js without an authentication npmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download exact prepared artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/dnh-release-bundle
          merge-multiple: true
          digest-mismatch: error

      - name: Bind downloaded bundle identity
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          EXPECTED_VERIFIER_SHA256: ${{ needs.prepare.outputs.verifier_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_VERIFIER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          manifest_sha256="$(sha256sum "$BUNDLE_DIRECTORY/release-manifest.json" | cut -d ' ' -f 1)"
          verifier_sha256="$(sha256sum "$BUNDLE_DIRECTORY/check-release.mjs" | cut -d ' ' -f 1)"
          test "$manifest_sha256" = "$EXPECTED_MANIFEST_SHA256"
          test "$verifier_sha256" = "$EXPECTED_VERIFIER_SHA256"

      - name: Install exact npm CLI
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --registry https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"

      - name: Validate downloaded bundle
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          node "$BUNDLE_DIRECTORY/check-release.mjs" validate-bundle \
            --bundle "$BUNDLE_DIRECTORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"

      - name: Classify registry version
        id: registry
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
        run: |
          node "$BUNDLE_DIRECTORY/check-release.mjs" registry-state \
            --bundle "$BUNDLE_DIRECTORY" \
            --output-file "$GITHUB_OUTPUT"

      - name: Publish exact tarball
        if: steps.registry.outputs.registry_state == 'missing'
        continue-on-error: true
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
          RELEASE_NAME: ${{ needs.prepare.outputs.name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm publish "$BUNDLE_DIRECTORY/$RELEASE_NAME-$RELEASE_VERSION.tgz" --ignore-scripts --access public --tag latest --provenance --registry https://registry.npmjs.org

      - name: Verify published registry artifact
        if: success()
        env:
          BUNDLE_DIRECTORY: ${{ runner.temp }}/dnh-release-bundle
        run: |
          node "$BUNDLE_DIRECTORY/check-release.mjs" verify-registry \
            --bundle "$BUNDLE_DIRECTORY" \
            --attempts 12 \
            --delay-ms 5000

  github-release:
    name: Create and verify GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag is not canonical stable SemVer." >&2
            exit 1
          fi
          response_file="$(mktemp)"
          error_file="$(mktemp)"
          trap 'rm -f "$response_file" "$error_file"' EXIT
          set +e
          gh api --method GET --include \
            -H "Accept: application/vnd.github+json" \
            "repos/$RELEASE_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '[.tag_name, .name, .draft, .prerelease] | @tsv' \
            > "$response_file" 2> "$error_file"
          lookup_status="$?"
          set -e
          http_status="$(sed -n '1s/^HTTP\/[^ ]* \([0-9][0-9][0-9]\).*/\1/p' "$response_file")"
          expected_state="$(printf '%s\t%s\tfalse\tfalse' "$RELEASE_TAG" "$RELEASE_TAG")"
          if [[ "$lookup_status" -eq 0 ]]; then
            test "$http_status" = "200"
            release_state="$(tail -n 1 "$response_file")"
            test "$release_state" = "$expected_state"
          else
            if [[ "$http_status" != "404" ]]; then
              cat "$error_file" >&2
              exit "$lookup_status"
            fi
            set +e
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
            set -e
          fi
          verified_state="$(gh release view "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease \
            --jq '[.tagName, .name, .isDraft, .isPrerelease] | @tsv')"
          test "$verified_state" = "$expected_state"
